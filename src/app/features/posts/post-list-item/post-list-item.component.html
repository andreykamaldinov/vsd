<button
  type="button"
  class="box-border h-full min-h-0 w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-left font-inherit text-inherit shadow-sm flex min-h-0 flex-col
         transition-[border-color,box-shadow] duration-150 ease-out
         hover:border-blue-500 hover:shadow-md
         focus-visible:outline-2 focus-visible:outline focus-visible:outline-blue-600 focus-visible:outline-offset-2"
  (click)="pick.emit(post())"
>
  <div class="flex min-w-0 shrink-0 flex-col gap-1.5">
    <span class="line-clamp-2 text-base font-semibold leading-tight text-balance">
      {{ post().title }}
    </span>

    <p
      class="m-0 h-[calc(1.45em*3)] min-w-0 overflow-hidden break-words text-[0.8125rem] leading-[1.45] line-clamp-3 text-slate-600"
    >
      {{ post().body }}
    </p>
  </div>

  <span
    class="mt-auto flex min-w-0 shrink-0 flex-wrap items-center gap-x-1.5 gap-y-0.5 border-t border-slate-100 pt-1.5 text-[0.75rem] leading-tight text-slate-500"
  >
    <span>{{ author()?.name }}</span>
    <span>·</span>

    <time [attr.datetime]="post().createdAt">
      {{ post().createdAt | date:'medium' }}
    </time>

    <span>·</span>
    <span>{{ post().readTime }} min read</span>
  </span>
</button>
