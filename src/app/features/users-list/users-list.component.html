<section class="flex h-full min-h-0 flex-1 flex-col border-r border-slate-200 bg-slate-50" aria-label="Users">
  <header class="sticky top-0 z-[2] border-b border-slate-200 bg-slate-50 px-3 py-3">
    <h2 class="m-0 text-base leading-snug font-semibold">Users — {{ usersSelected().size }} selected of {{ allUsers().length }}</h2>
  </header>
  <div
    class="flex min-h-0 flex-1 flex-col gap-1.5 overflow-x-hidden overflow-y-auto px-2.5 pb-3.5 pt-2 focus-visible:outline-none listbox"
  >
    @for (user of allUsers(); track user.id) {
      <app-user-list-item
        class="block"
        [user]="user"
        [index]="$index"
        [selected]="usersSelected().has(user.id)"
        (toggled)="store.toggleUser($event)"
      />
    }
  </div>
</section>
