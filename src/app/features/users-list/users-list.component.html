<section
  class="flex h-full min-h-0 flex-1 flex-col border-r border-slate-200 bg-slate-50 max-[720px]:border-r-0 max-[720px]:border-b max-[720px]:border-slate-200"
  aria-label="Users"
>
  <header class="sticky top-0 z-[2] border-b border-slate-200 bg-slate-50 px-3 py-3">
    <h2 class="m-0 text-base leading-snug font-semibold">Users — {{ usersSelected().size }} selected of {{ allUsers().length }}</h2>
  </header>
  <div
    class="flex min-h-0 flex-1 flex-col overflow-x-hidden px-3 pb-3.5 pt-2 focus-visible:outline-none [-webkit-overflow-scrolling:touch]"
  >
    <app-ui-virtual-scroll
      class="min-h-0 flex-1"
      [items]="allUsers()"
      [itemHeight]="userRowHeightPx()"
      [height]="'100%'"
      [buffer]="6"
    >
      <ng-template #itemTemplate let-user let-index="index">
        <div class="box-border flex h-full min-h-0 flex-col px-0.5 pb-2">
          <app-user-list-item
            class="block h-full min-h-0 flex-1"
            [user]="user"
            [index]="index"
            [selected]="usersSelected().has(user.id)"
            (toggled)="store.toggleUser($event)"
          />
        </div>
      </ng-template>
    </app-ui-virtual-scroll>
  </div>
</section>
